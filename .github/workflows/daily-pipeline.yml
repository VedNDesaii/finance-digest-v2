name: Daily pipeline

# Runs the full news pipeline once a day and commits the updated data files
# (market summary + quiz) so Vercel redeploys. Keys come from repo Secrets —
# never hard-coded. You can also run it on demand from the Actions tab.
on:
  schedule:
    - cron: "30 2 * * *"    # 2:30 UTC = 8:00 AM IST (pre-market morning news)
    - cron: "30 11 * * *"   # 11:30 UTC = 5:00 PM IST (after the Indian market close)
  workflow_dispatch: {}      # manual "Run workflow" button

# allow the job to push the updated data files back to the repo
permissions:
  contents: write

# never run two pipelines at once
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -e
          python fetch_news.py
          python process_articles.py
          python generate_market_summary.py
          python generate_quiz.py

      - name: Commit updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/market-data.json public/daily-quiz.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "update market & quiz $(date -u +'%Y-%m-%d')"
            git push
          fi
