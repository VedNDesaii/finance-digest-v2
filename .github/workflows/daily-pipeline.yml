name: Daily pipeline

# Two scheduled runs a day (keys come from repo Secrets, never hard-coded):
#   • 8:45 AM IST — news refresh (./refresh-news.sh)
#   • 3:50 PM IST — market summary (./update_market.sh), after the 3:30 PM Indian
#     market close, so it reflects the actual close, not stale pre-market data.
# A manual "Run workflow" runs BOTH, so you can test the whole thing on demand.
on:
  schedule:
    - cron: "15 3 * * *"       # 3:15 UTC  = 8:45 AM IST — news refresh
    # Intraday market-summary checkpoints (Mon–Fri). Each publishes LIVE to
    # Supabase, so the site updates instantly — no push needed.
    - cron: "45 3 * * 1-5"     # 3:45 UTC  = 9:15 AM IST  — market open
    - cron: "15 5 * * 1-5"     # 5:15 UTC  = 10:45 AM IST — mid-morning
    - cron: "0 7 * * 1-5"      # 7:00 UTC  = 12:30 PM IST — midday
    - cron: "45 9 * * 1-5"     # 9:45 UTC  = 3:15 PM IST  — pre-close
    - cron: "30 10 * * 1-5"    # 10:30 UTC = 4:00 PM IST  — full end-of-day summary
  workflow_dispatch: {}        # manual "Run workflow" button (runs both)

# allow the job to push the updated data files back to the repo
permissions:
  contents: write

# never run two pipelines at once
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history so the push below works

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The shell scripts read keys from .env (refresh-news.sh even unsets the
      # shell ANTHROPIC_API_KEY on purpose, to let .env be the single source of
      # truth). So materialise .env from the repo secrets. .env* is gitignored,
      # and the runner is ephemeral, so nothing is ever committed or leaked.
      - name: Write .env from secrets
        run: |
          {
            echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY"
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_KEY=$SUPABASE_KEY"
          } > .env

      # update_market.sh commits + pushes the static fallback itself, so give git
      # an identity to commit under.
      - name: Configure git
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # ── 8:45 AM IST: clear → fetch → process news (writes live to Supabase) ──
      - name: Morning — refresh news
        if: github.event.schedule == '15 3 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          chmod +x refresh-news.sh
          ./refresh-news.sh

      # ── Intraday + close market-summary checkpoints (9:15, 10:45, 12:30, 3:15, 4:00 IST) ──
      # Each run re-reads live prices + news and rewrites the figure-backed summary
      # (incl. per-index reasoning). Publishes live to Supabase; the 4:00 PM run is
      # the full end-of-day write-up.
      - name: Market summary (intraday + close)
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.event.schedule == '45 3 * * 1-5' ||
          github.event.schedule == '15 5 * * 1-5' ||
          github.event.schedule == '0 7 * * 1-5' ||
          github.event.schedule == '45 9 * * 1-5' ||
          github.event.schedule == '30 10 * * 1-5'
        run: |
          chmod +x update_market.sh
          ./update_market.sh

      # Safety net: push any commit the scripts made but couldn't push on a flaky
      # connection. Never fails the job — the live Supabase data is already up.
      - name: Push any pending data commits
        if: always()
        continue-on-error: true
        run: |
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || true

      # ── Keep this scheduled workflow permanently alive ──
      # GitHub auto-disables a cron schedule after 60 days when only automated
      # (bot) commits have landed — and once disabled it STAYS disabled until a
      # human re-enables it, which is what silently stops the daily update. This
      # step registers real repository activity on every scheduled run, so the
      # 60-day timer never elapses and the schedule can't be auto-disabled.
      # It runs only on scheduled runs and can never fail the pipeline.
      - name: Keep workflow alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        uses: gautamkrishnar/keepalive-workflow@v2
