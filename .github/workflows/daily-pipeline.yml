name: Daily pipeline

# Two scheduled runs a day (keys come from repo Secrets, never hard-coded):
#   • 8:30 AM IST — morning news + daily quiz
#   • 3:45 PM IST — market summary (after the 3:30 PM Indian market close, so it
#     reflects the actual close, not stale pre-market data)
# A manual "Run workflow" runs BOTH, so you can test the whole thing on demand.
on:
  schedule:
    - cron: "0 3 * * *"     # 3:00 UTC  = 8:30 AM IST — news + quiz
    - cron: "15 10 * * *"   # 10:15 UTC = 3:45 PM IST — market summary
  workflow_dispatch: {}      # manual "Run workflow" button (runs both)

# allow the job to push the updated data files back to the repo
permissions:
  contents: write

# never run two pipelines at once
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 8:30 AM IST: fetch + process news, then the daily quiz ──
      - name: Morning — news + quiz
        if: github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          set -e
          python fetch_news.py
          python process_articles.py
          python generate_quiz.py

      # ── 3:45 PM IST: market summary, after the Indian market close ──
      - name: Afternoon — market summary
        if: github.event.schedule == '15 10 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          set -e
          python generate_market_summary.py

      - name: Commit updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/market-data.json public/daily-quiz.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "update market & quiz $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi
