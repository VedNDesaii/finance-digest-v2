# Render Blueprint — scheduled pipelines at EXACT times (precise; runs your
# Python as-is; laptop can be off).
#
# Setup: Render → New → Blueprint → connect this repo (branch: editorial-homepage).
# Render creates one env-var GROUP (fd-secrets) + the cron jobs. Set the four
# secret values ONCE in the group → all jobs inherit them:
#   ANTHROPIC_API_KEY, SUPABASE_URL, SUPABASE_KEY, GNEWS_API_KEY
#
# Flow (IST, schedules in UTC = IST − 5:30):
#   09:00  news refresh
#   09:15  small market update   (light: numbers + per-index "why")
#   10:45  small market update   (light)
#   12:30  small market update   (light)
#   14:15  small market update   (light)
#   15:45  FULL market summary   (end-of-day: narrative, sectors, movers, signals)
#
# Each job writes a .env from the env vars first (the scripts read keys from .env),
# then runs. "light" on update_market.sh = the small intraday update.

envVarGroups:
  - name: fd-secrets
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GNEWS_API_KEY
        sync: false

services:
  # ── 09:00 AM IST — news refresh ──
  - type: cron
    name: fd-news-refresh
    runtime: python
    plan: starter
    schedule: "30 3 * * *"            # 03:30 UTC = 09:00 AM IST
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      printf 'ANTHROPIC_API_KEY=%s\nSUPABASE_URL=%s\nSUPABASE_KEY=%s\nGNEWS_API_KEY=%s\n'
      "$ANTHROPIC_API_KEY" "$SUPABASE_URL" "$SUPABASE_KEY" "$GNEWS_API_KEY" > .env
      && bash ./refresh-news.sh
    envVars:
      - fromGroup: fd-secrets

  # ── 09:15 AM IST — small update ──
  - type: cron
    name: fd-market-0915
    runtime: python
    plan: starter
    schedule: "45 3 * * 1-5"          # 03:45 UTC = 09:15 AM IST, Mon–Fri
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      printf 'ANTHROPIC_API_KEY=%s\nSUPABASE_URL=%s\nSUPABASE_KEY=%s\nGNEWS_API_KEY=%s\n'
      "$ANTHROPIC_API_KEY" "$SUPABASE_URL" "$SUPABASE_KEY" "$GNEWS_API_KEY" > .env
      && bash ./update_market.sh light
    envVars:
      - fromGroup: fd-secrets

  # ── 10:45 AM IST — small update ──
  - type: cron
    name: fd-market-1045
    runtime: python
    plan: starter
    schedule: "15 5 * * 1-5"          # 05:15 UTC = 10:45 AM IST, Mon–Fri
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      printf 'ANTHROPIC_API_KEY=%s\nSUPABASE_URL=%s\nSUPABASE_KEY=%s\nGNEWS_API_KEY=%s\n'
      "$ANTHROPIC_API_KEY" "$SUPABASE_URL" "$SUPABASE_KEY" "$GNEWS_API_KEY" > .env
      && bash ./update_market.sh light
    envVars:
      - fromGroup: fd-secrets

  # ── 12:30 PM IST — small update ──
  - type: cron
    name: fd-market-1230
    runtime: python
    plan: starter
    schedule: "0 7 * * 1-5"           # 07:00 UTC = 12:30 PM IST, Mon–Fri
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      printf 'ANTHROPIC_API_KEY=%s\nSUPABASE_URL=%s\nSUPABASE_KEY=%s\nGNEWS_API_KEY=%s\n'
      "$ANTHROPIC_API_KEY" "$SUPABASE_URL" "$SUPABASE_KEY" "$GNEWS_API_KEY" > .env
      && bash ./update_market.sh light
    envVars:
      - fromGroup: fd-secrets

  # ── 02:15 PM IST — small update ──
  - type: cron
    name: fd-market-1415
    runtime: python
    plan: starter
    schedule: "45 8 * * 1-5"          # 08:45 UTC = 02:15 PM IST, Mon–Fri
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      printf 'ANTHROPIC_API_KEY=%s\nSUPABASE_URL=%s\nSUPABASE_KEY=%s\nGNEWS_API_KEY=%s\n'
      "$ANTHROPIC_API_KEY" "$SUPABASE_URL" "$SUPABASE_KEY" "$GNEWS_API_KEY" > .env
      && bash ./update_market.sh light
    envVars:
      - fromGroup: fd-secrets

  # ── 03:45 PM IST — FULL end-of-day summary ──
  - type: cron
    name: fd-market-1545-close
    runtime: python
    plan: starter
    schedule: "15 10 * * 1-5"         # 10:15 UTC = 03:45 PM IST, Mon–Fri
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      printf 'ANTHROPIC_API_KEY=%s\nSUPABASE_URL=%s\nSUPABASE_KEY=%s\nGNEWS_API_KEY=%s\n'
      "$ANTHROPIC_API_KEY" "$SUPABASE_URL" "$SUPABASE_KEY" "$GNEWS_API_KEY" > .env
      && bash ./update_market.sh
    envVars:
      - fromGroup: fd-secrets
