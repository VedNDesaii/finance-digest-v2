# Render Blueprint — scheduled pipelines at EXACT times (precise, runs your
# Python as-is; laptop can be off).
#
# Setup: Render → New → Blueprint → connect this repo (branch: editorial-homepage).
# Render creates one env-var GROUP (fd-secrets) + the cron jobs. Set the four
# secret values ONCE in the group → all jobs inherit them:
#   ANTHROPIC_API_KEY, SUPABASE_URL, SUPABASE_KEY, GNEWS_API_KEY
#
# Schedules are UTC (IST = UTC + 5:30). Each job writes a .env from the env vars
# first (the shell scripts read keys from .env), then runs.

envVarGroups:
  - name: fd-secrets
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GNEWS_API_KEY
        sync: false

services:
  # ── News refresh — 08:45 AM IST daily ──
  - type: cron
    name: fd-news-refresh
    runtime: python
    plan: starter
    schedule: "15 3 * * *"            # 03:15 UTC = 08:45 AM IST
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      printf 'ANTHROPIC_API_KEY=%s\nSUPABASE_URL=%s\nSUPABASE_KEY=%s\nGNEWS_API_KEY=%s\n'
      "$ANTHROPIC_API_KEY" "$SUPABASE_URL" "$SUPABASE_KEY" "$GNEWS_API_KEY" > .env
      && bash ./refresh-news.sh
    envVars:
      - fromGroup: fd-secrets

  # ── Market summary — 09:15 AM IST (market open) ──
  - type: cron
    name: fd-market-0915
    runtime: python
    plan: starter
    schedule: "45 3 * * 1-5"          # 03:45 UTC = 09:15 AM IST, Mon–Fri
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      printf 'ANTHROPIC_API_KEY=%s\nSUPABASE_URL=%s\nSUPABASE_KEY=%s\nGNEWS_API_KEY=%s\n'
      "$ANTHROPIC_API_KEY" "$SUPABASE_URL" "$SUPABASE_KEY" "$GNEWS_API_KEY" > .env
      && bash ./update_market.sh
    envVars:
      - fromGroup: fd-secrets

  # ── Market summary — 10:45 AM IST (mid-morning) ──
  - type: cron
    name: fd-market-1045
    runtime: python
    plan: starter
    schedule: "15 5 * * 1-5"          # 05:15 UTC = 10:45 AM IST, Mon–Fri
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      printf 'ANTHROPIC_API_KEY=%s\nSUPABASE_URL=%s\nSUPABASE_KEY=%s\nGNEWS_API_KEY=%s\n'
      "$ANTHROPIC_API_KEY" "$SUPABASE_URL" "$SUPABASE_KEY" "$GNEWS_API_KEY" > .env
      && bash ./update_market.sh
    envVars:
      - fromGroup: fd-secrets

  # ── Market summary — 12:30 PM IST (midday) ──
  - type: cron
    name: fd-market-1230
    runtime: python
    plan: starter
    schedule: "0 7 * * 1-5"           # 07:00 UTC = 12:30 PM IST, Mon–Fri
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      printf 'ANTHROPIC_API_KEY=%s\nSUPABASE_URL=%s\nSUPABASE_KEY=%s\nGNEWS_API_KEY=%s\n'
      "$ANTHROPIC_API_KEY" "$SUPABASE_URL" "$SUPABASE_KEY" "$GNEWS_API_KEY" > .env
      && bash ./update_market.sh
    envVars:
      - fromGroup: fd-secrets

  # ── Market summary — 03:15 PM IST (pre-close) ──
  - type: cron
    name: fd-market-1515
    runtime: python
    plan: starter
    schedule: "45 9 * * 1-5"          # 09:45 UTC = 03:15 PM IST, Mon–Fri
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      printf 'ANTHROPIC_API_KEY=%s\nSUPABASE_URL=%s\nSUPABASE_KEY=%s\nGNEWS_API_KEY=%s\n'
      "$ANTHROPIC_API_KEY" "$SUPABASE_URL" "$SUPABASE_KEY" "$GNEWS_API_KEY" > .env
      && bash ./update_market.sh
    envVars:
      - fromGroup: fd-secrets

  # ── Market summary — 04:00 PM IST (full end-of-day summary) ──
  - type: cron
    name: fd-market-1600
    runtime: python
    plan: starter
    schedule: "30 10 * * 1-5"         # 10:30 UTC = 04:00 PM IST, Mon–Fri
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      printf 'ANTHROPIC_API_KEY=%s\nSUPABASE_URL=%s\nSUPABASE_KEY=%s\nGNEWS_API_KEY=%s\n'
      "$ANTHROPIC_API_KEY" "$SUPABASE_URL" "$SUPABASE_KEY" "$GNEWS_API_KEY" > .env
      && bash ./update_market.sh
    envVars:
      - fromGroup: fd-secrets
